<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <title>Comments Section</title>
</head>
<body>
    <div class="comments-section">
        <div class="comment">
            <img src="./images/avatars/image-amyrobson.png" alt="Amy Robson" class="avatar">
            <div class="comment-content">
                <div class="comment-header">
                    <span class="username">Amy Robson</span>
                    <span class="timestamp">1 month ago</span>
                    <img src="./images/icon-edit.svg" alt="Edit" class="edit-icon">
                </div>
                <p class="comment-text">Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>
                <div class="reply">
                    <button class="reply-btn">Reply</button>
                </div>
            </div>
        </div>
        <!-- Repeat the comment block for more comments -->
    </div>
</body>
</html>
